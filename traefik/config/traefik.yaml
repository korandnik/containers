global:
  checkNewVersion: true
  sendAnonymousUsage: false
# log:
#   level: DEBUG
api:
  dashboard: true
  insecure: false
entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: :443
    http:
      tls: true
  ssh:
    address: :222
providers:
  docker:
    exposedbydefault: false
    network: frontend

certificatesresolvers:
  le:
    acme:
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      caServer: https://acme-v02.api.letsencrypt.org/directory
      email: korandnik2006@gmail.com
      storage: /letsencrypt/acme.json
      httpchallenge:
        entrypoint: web

